name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Dokploy image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.PUBLISH_IMAGE == 'true'
    concurrency:
      cancel-in-progress: false
      group: portfolio-main-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Optional: the image rewrites robots.txt and the sitemap from the container's SITE_URL at start.
      DOKPLOY_SITE_URL: ${{ vars.DOKPLOY_SITE_URL || 'http://localhost:3000' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portfolio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Provenance and SBOM attestations need a BuildKit container builder, not the default driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=main
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SITE_URL=${{ env.DOKPLOY_SITE_URL }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      # Dokploy's webhook URL only accepts Docker Hub pushes, so GHCR deploys go through its API.
      - name: Trigger Dokploy deployment
        if: ${{ vars.DOKPLOY_URL != '' && vars.DOKPLOY_APPLICATION_ID != '' }}
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
        run: |
          curl -fsS --retry 2 -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${DOKPLOY_APPLICATION_ID}\"}"
