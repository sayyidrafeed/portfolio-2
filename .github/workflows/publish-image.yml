name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Dokploy image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.PUBLISH_IMAGE == 'true'
    concurrency:
      cancel-in-progress: false
      group: portfolio-main-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Baked into canonical, Open Graph, JSON-LD, robots.txt and the sitemap at build time.
      DOKPLOY_SITE_URL: ${{ vars.DOKPLOY_SITE_URL || 'https://sayyidrafee.com' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portfolio
      DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # Provenance and SBOM attestations need a BuildKit container builder, not the default driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=main
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SITE_URL=${{ env.DOKPLOY_SITE_URL }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
      # A bare POST to the Dokploy deploy webhook redeploys the configured image (Auto Deploy must be on).
      - name: Trigger Dokploy deployment
        if: ${{ env.DOKPLOY_WEBHOOK_URL != '' }}
        run: |
          curl -fsS --retry 2 -X POST "$DOKPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{}'
