name: Publish image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish Dokploy image
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.PUBLISH_IMAGE == 'true'
    concurrency:
      cancel-in-progress: false
      group: portfolio-main-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Optional: the image rewrites robots.txt and the sitemap from the container's SITE_URL at start.
      DOKPLOY_SITE_URL: ${{ vars.DOKPLOY_SITE_URL || 'http://localhost:3000' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/portfolio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=main
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            SITE_URL=${{ env.DOKPLOY_SITE_URL }}
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
