services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_USER: portfolio
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    profiles: ["app"]
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio@postgres:5432/portfolio
      NODE_ENV: production
      PAYLOAD_SECRET: local-container-payload-secret-at-least-32-characters
      SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    volumes:
      - media-data:/app/media

volumes:
  media-data:
  postgres-data:
